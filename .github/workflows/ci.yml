name: CI

on:
  push:
  pull_request:
  schedule:
    # Fuzzing を毎晩実行する (ADR-024)。18:00 UTC は日本時間の 3:00。
    - cron: "0 18 * * *"

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      # cargo-fuzz は sanitizer を使うため nightly を要求する。
      - run: rustup toolchain install nightly --profile minimal
      - run: mise run check

  fuzz-check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: rustup toolchain install nightly --profile minimal
      - run: mise run fuzz:check

  safari:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: sudo safaridriver --enable
      # SafariDriver の接続が切れることがあるため、外部要因の失敗は一度だけやり直す。
      - run: mise run test-browser-safari || mise run test-browser-safari
      - run: mise run e2e-safari || mise run e2e-safari

  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - run: rustup toolchain install nightly --profile minimal
      # corpus はリポジトリの初期値を復元し、実行で増えた入力を次の実行へ引き継ぐ (ADR-024)。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: backend/fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-
      - run: mise run fuzz
