[package]
name = "warrior_frontend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "=0.7.10", default-features = false, features = ["web", "minimal", "document"] }
dioxus-router = "=0.7.10"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# dioxus-web は host のビルドでも履歴の API を使うため、Location を明示する。
web-sys = { version = "0.3", features = [
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "Location",
  "MediaQueryList",
  "Navigator",
  "ServiceWorker",
  "ServiceWorkerContainer",
  "ServiceWorkerRegistration",
  "Window",
] }

[dev-dependencies]
# ブラウザの API を実ブラウザで確かめるテスト。
wasm-bindgen-test = "0.3"
