[package]
name = "warrior_service_worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
warrior_core = { path = "../backend/warrior_core" }
serde_json = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Cache",
    "CacheStorage",
    "Client",
    "ClientQueryOptions",
    "ClientType",
    "Clients",
    "Event",
    "EventTarget",
    "ExtendableEvent",
    "FetchEvent",
    "Headers",
    "MessageEvent",
    "NotificationOptions",
    "PushEvent",
    "PushMessageData",
    "Request",
    "RequestCredentials",
    "RequestInit",
    "RequestMode",
    "Response",
    "ServiceWorkerGlobalScope",
    "ServiceWorkerRegistration",
    "Url",
    "WindowClient",
    "WorkerGlobalScope",
] }
