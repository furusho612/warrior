[tools]
# ツールの版は ADR-022 で固定する。版は latest にしない。
rust = { version = "1.99.0", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["wasm32-unknown-unknown"] }
"cargo:worker-build" = "0.8.6"
node = "24.21.0"
wrangler = { version = "4.135.0", allow_builds = ["esbuild", "sharp", "workerd"] }
"github:DioxusLabs/dioxus" = "0.7.10"
"github:wasm-bindgen/wasm-bindgen" = "0.2.129"
chromedriver = "157.0.8103.15"
"cargo:cargo-fuzz" = "0.13.2"
ripgrep = "15.2.0"
java = "temurin-25.0.4+101.0.LTS"

[tasks.setup]
description = "開発に必要な依存を取得する"
run = "cargo fetch"

[tasks.tokens]
description = "docs/design/tokens.json から CSS と Rust の定数を生成する"
run = "cargo run -q -p warrior_token_gen"

[tasks."tokens:lint-colors"]
description = "frontend の生成物の外に色のリテラル値が無いことを検査する"
run = [
  "rg --version",
  "! rg -n --glob '!generated/**' --pcre2 '#[0-9A-Fa-f]{3,8}\\b' frontend/src",
  "! rg -n --pcre2 '#[0-9A-Fa-f]{3,8}\\b' frontend/tailwind.css",
  "! rg -n --pcre2 'class: \"[^\"]*(rounded|shadow)' frontend/src",
]

[tasks.fmt]
description = "Rust の整形を検査する"
depends = ["tokens"]
run = "cargo fmt --all --check"

[tasks.lint]
description = "Rust の lint と、絵文字と色のリテラル値を使わない規約の検査を実行する"
depends = ["tokens", "tokens:lint-colors"]
run = [
  "cargo clippy --workspace --all-targets -- -D warnings",
  "rg --version",
  "! rg --hidden -g '!.git' --pcre2 '(\\p{Emoji_Presentation}|\\p{Emoji}\\x{FE0F})'",
]

[tasks.test]
description = "wrangler dev を起動するテスト以外の自動テストを実行する"
depends = ["tokens"]
run = "cargo test --workspace -- --skip wrangler_"

[tasks."test-integration"]
description = "wrangler dev を起動する結合テストを実行する"
depends = ["backend:build", "frontend:build"]
run = "cargo test -p warrior --test wrangler_http_foundation"

[tasks."test-oidc:build"]
description = "テスト専用の OIDC の提供者をビルドする"
run = "cargo build -p warrior_test_oidc"

[tasks.e2e]
description = "Chrome の E2E と、資源の teardown のテストを実行する"
depends = ["backend:build", "frontend:build", "test-oidc:build"]
run = "cargo test -p warrior --test e2e_harness_smoke --test support_teardown --test wrangler_oidc_provider"

[tasks."e2e-safari"]
description = "Safari の E2E のスモークを実行する"
depends = ["backend:build", "frontend:build", "test-oidc:build"]
run = """
set -e
export WARRIOR_E2E_BROWSER=safari
cargo test -p warrior --test e2e_harness_smoke
"""

[tasks."test-browser"]
description = "ブラウザの API のテストを headless の Chrome で実行する"
depends = ["tokens"]
run = """
set -e
if ! command -v chromedriver > /dev/null 2>&1; then
  echo "chromedriver is required to run test-browser but was not found" >&2
  exit 1
fi
export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner
export CHROMEDRIVER="$(command -v chromedriver)"
export WASM_BINDGEN_TEST_DRIVER_TIMEOUT=60
export WASM_BINDGEN_TEST_TIMEOUT=300
cargo test -p warrior_frontend --target wasm32-unknown-unknown
"""

[tasks."test-browser-safari"]
description = "ブラウザの API のテストを Safari で実行する"
depends = ["tokens"]
run = """
set -e
export CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER=wasm-bindgen-test-runner
export SAFARIDRIVER=/usr/bin/safaridriver
export WASM_BINDGEN_TEST_WEBDRIVER_JSON="$PWD/frontend/webdriver-safari.json"
export WASM_BINDGEN_TEST_DRIVER_TIMEOUT=60
export WASM_BINDGEN_TEST_TIMEOUT=300
cargo test -p warrior_frontend --target wasm32-unknown-unknown
"""

[tasks."test-pbt"]
description = "性質テストを実行する"
run = "cargo test -p warrior_pbt"

[tasks."backend:build"]
description = "利用者向けの Worker をビルドする"
dir = "backend/warrior"
run = "worker-build --release"

[tasks."frontend:build-service-worker"]
description = "Service Worker の wasm と JavaScript をビルドして配信物に置く"
run = """
set -e
cargo build -p warrior_service_worker --target wasm32-unknown-unknown --release
mkdir -p frontend/public/sw
wasm-bindgen --target no-modules --out-dir frontend/public/sw --out-name warrior_sw target/wasm32-unknown-unknown/release/warrior_service_worker.wasm
"""

[tasks."frontend:build"]
description = "Frontend (Dioxus) を Web 向けにリリースビルドする"
depends = ["tokens", "frontend:build-service-worker"]
dir = "frontend"
run = """
set -e
mise exec -- dx build --release --platform web
# dx は public/ の静的ファイルを成果物へ写さないため、配信物に明示的に含める。
cp -R public/. ../target/dx/warrior_frontend/release/web/public/
"""

[tasks."build-frontend"]
description = "Frontend をビルドする (frontend:build の別名)"
depends = ["frontend:build"]

[tasks."build-service-worker"]
description = "Service Worker をビルドする (frontend:build-service-worker の別名)"
depends = ["frontend:build-service-worker"]

[tasks.build]
description = "Worker と Frontend をビルドする"
depends = ["backend:build", "frontend:build"]

[tasks.dev]
description = "ローカル開発の画面と API を同じオリジンから配信する"
depends = ["backend:build", "frontend:build"]
run = "wrangler dev --local"

[tasks.deploy-production]
description = "production の Worker をデプロイする"
depends = ["backend:build", "frontend:build"]
run = "wrangler deploy --env production"

[tasks.db-migrate-local]
description = "ローカルの D1 にマイグレーションを適用する"
run = "wrangler d1 migrations apply DB --local"

[tasks.check]
description = "静的検査と全ての自動テスト、ビルドを実行する (CI と手元の共通の入口)"
depends = ["tokens", "fmt", "lint", "test", "test-pbt", "test-integration", "test-browser", "e2e", "backend:build", "frontend:build"]
