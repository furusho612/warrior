[package]
name = "warrior_fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# cargo-fuzz のターゲットを持つクレートであることを示す。
[package.metadata]
cargo-fuzz = true

[lib]
name = "warrior_fuzz"
path = "src/lib.rs"

# Fuzzing はテスト専用であり、本番の wasm に含めない (ADR-025)。
[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
warrior_core = { path = "../warrior_core" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "ecdh"] }

[[bin]]
name = "ai_output"
path = "fuzz_targets/ai_output.rs"
test = false
doc = false
bench = false

[[bin]]
name = "base64url"
path = "fuzz_targets/base64url.rs"
test = false
doc = false
bench = false

[[bin]]
name = "datetime"
path = "fuzz_targets/datetime.rs"
test = false
doc = false
bench = false

